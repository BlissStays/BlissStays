<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bliss Living</title>
  <style>
    /* Reset */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #444;
      line-height: 1.6;
      background-color: #f4f0e6;
      margin: 0;
      padding: 0;
      background-color: #f4f0e6;
      width: 100%;
      min-height: 100%;
    }
    a { text-decoration: none; color: inherit; }

    /* Colors */
    :root {
      --primary: #4b4b38;
      --accent: #6b6b50;
      --light: #f8f5ee;
    }

    /* Hero with video */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.4);
      z-index: 1;
    }

    .hero-logo {
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    .hero-logo img {
      max-width: 300px;
      width: 90%;
      height: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
    }


    

    .logo-block {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  font-family: 'Helvetica Neue', Arial, sans-serif;
}

.logo-text {
  letter-spacing: 0.5px;
}

.home-message-wrapper {
  background-color: #f4f0e0; /* Makes the entire width same color */
  width: 100%;
}

.home-message {
  padding: 100px 20px;
  max-width: 1200px;
  margin: 0 auto;
}

.home-message-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 60px;
  align-items: center;
  justify-content: space-between;
  min-height: 320px;
}

.home-message-left {
  flex: 1 1 300px;
  font-size: 2.0rem;
  font-weight: 500;
  line-height: 1.3;
  color: var(--primary);
}

.home-message-right {
  flex: 1 1 500px;
  font-size: 1.4rem;
  font-weight: 400;
  line-height: 1.8;
  color: var(--primary);
}

@media (max-width: 768px) {
  .home-message-inner {
    flex-direction: column;
    text-align: center;
  }

  .home-message-left {
    font-size: 1.8rem;
    margin-bottom: 20px;
  }

  .home-message-right {
    font-size: 1rem;
  }
}

/* Outer full-width background wrapper */
.bliss-brands-fullwrap {
  background-color: #f4f0e6;
  width: 100%;
}

/* Section inside wrapper */
.bliss-brands-showcase {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 100px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Content wrapper */
.brands-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brands-left {
  text-align: center;
  max-width: 800px;
  margin-bottom: 40px;
}

.brands-left h5 {
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 0.8rem;
  color: var(--accent);
  margin-bottom: 10px;
}

.brands-left h2 {
  font-size: 2.2rem;
  font-weight: 600;
  margin-bottom: 20px;
  line-height: 1.3;
}

.brands-left p {
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 12px;
}

/* Cards container */
.brands-right {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  justify-content: center;
}

.brand-card {
  background: #ece8dd;
  text-align: center;
  flex: 1 1 250px;
  max-width: 300px;
  padding-bottom: 20px;
  border-radius: 0;
  box-shadow: none;
}

.brand-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
}

.brand-card h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 15px 15px 5px;
}

.brand-card p {
  font-size: 0.95rem;
  color: #555;
  margin: 0 15px 10px;
}

.brand-card a {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--primary);
  text-decoration: none;
  margin-bottom: 20px;
  display: inline-block;
}

.brand-card a:hover {
  color: var(--accent);
}

/* Mobile */
@media (max-width: 768px) {
  .brands-right {
    flex-direction: column;
    align-items: center;
  }

  .brand-card {
    width: 100%;
    max-width: 100%;
  }
}
/* Click-triggered animation keyframes */
@keyframes clickBounce {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Class that triggers the animation */
.animate-on-click {
  animation: clickBounce 0.3s ease;
}

.brand-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
}




  </style>
</head>
<body>
<script src="navbar.js"></script>


<script>
    (function(){
      const blocks = document.querySelectorAll('#terms .tc-block');
      if (!blocks.length) return;
    
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (e.isIntersecting){
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: .22 });
    
      blocks.forEach(b => io.observe(b));
    })();
    </script>
    

  <!-- Footer -->
<script src="footer.js"></script>
  

</body>
</html>
